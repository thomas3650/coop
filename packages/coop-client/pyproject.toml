[project]
name = "coop-client"
version = "0.0.0"
description = "A client for the Coop app's shopping-list API"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "aiohttp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coop_client"]
